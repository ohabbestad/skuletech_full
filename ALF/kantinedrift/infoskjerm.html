<!DOCTYPE html>
<html lang="nn">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kantina — Vekas Plan</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');

        body {
            font-family: 'Inter', sans-serif;
        }

        @keyframes pulseGlow {

            0%,
            100% {
                box-shadow: 0 0 0 0 rgba(99, 102, 241, .35);
            }

            50% {
                box-shadow: 0 0 28px 10px rgba(99, 102, 241, .15);
            }
        }

        .today-card {
            animation: pulseGlow 3s ease-in-out infinite;
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(18px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .init-animate {
            animation: fadeUp .45s ease-out both;
        }

        /* Second hand smooth sweep */
        #clock-second {
            transition: transform 0.08s linear;
        }
    </style>
</head>

<body class="bg-gradient-to-br from-slate-50 via-white to-indigo-50 text-slate-900 min-h-screen antialiased">

    <!-- ── Ladeskjerm ──────────────────────────────────────── -->
    <div id="loading-screen" class="min-h-screen flex items-center justify-center">
        <div class="text-center">
            <p class="text-xl text-slate-500 animate-pulse">Lastar kantineplanen…</p>
        </div>
    </div>

    <!-- ── Hovudvisning ────────────────────────────────────── -->
    <div id="main-view" class="hidden min-h-screen flex flex-col">

        <!-- Header med analog klokke -->
        <header class="bg-white border-b border-slate-200 shadow-sm py-4">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex items-center justify-between gap-4">
                <div class="flex items-center gap-3 sm:gap-4">
                    <img src="media/logo.png" alt="Logo" class="h-14 sm:h-[120px] w-auto block">
                    <div>
                        <h1 class="text-xl sm:text-4xl lg:text-5xl font-extrabold tracking-tight text-slate-900">Kantina
                        </h1>
                        <p class="text-slate-500 text-xs sm:text-base font-medium mt-0.5 sm:mt-1">Vekeplan</p>
                    </div>
                </div>

                <!-- Analog klokke -->
                <div class="flex flex-col items-center gap-1 select-none">
                    <svg id="clock-svg" viewBox="0 0 100 100" width="120" height="120"
                        style="filter:drop-shadow(0 2px 6px rgba(0,0,0,0.10))">
                        <!-- Urskive -->
                        <circle cx="50" cy="50" r="47" fill="white" stroke="#e2e8f0" stroke-width="2" />
                        <!-- Merker (generert av JS) -->
                        <g id="clock-ticks"></g>
                        <!-- Timar -->
                        <line id="clock-hour" x1="50" y1="50" x2="50" y2="28" stroke="#1e293b" stroke-width="5"
                            stroke-linecap="round" />
                        <!-- Minutt -->
                        <line id="clock-minute" x1="50" y1="52" x2="50" y2="16" stroke="#475569" stroke-width="3"
                            stroke-linecap="round" />
                        <!-- Sekund -->
                        <line id="clock-second" x1="50" y1="60" x2="50" y2="12" stroke="#6366f1" stroke-width="1.5"
                            stroke-linecap="round" />
                        <!-- Senterbol -->
                        <circle cx="50" cy="50" r="4" fill="#1e293b" />
                        <circle cx="50" cy="50" r="2" fill="white" />
                        <circle cx="50" cy="50" r="1.5" fill="#6366f1" />
                    </svg>
                    <span id="clock-digital"
                        class="text-xs font-mono font-bold text-slate-500 tabular-nums tracking-wide"></span>
                </div>
            </div>
        </header>

        <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6">

            <!-- ── MOBIL: fokus på i dag (berre < md) ──────────── -->
            <div id="mobile-today" class="block md:hidden space-y-4"></div>

            <!-- ── DESKTOP: rullande 4-dagarsvising (berre ≥ md) ── -->
            <div class="hidden md:block space-y-10">

                <section id="section-this-week" class="hidden">
                    <h2
                        class="text-slate-600 text-sm font-extrabold uppercase tracking-wider mb-4 pl-3 border-l-4 border-indigo-500">
                        Komande kantinedagar</h2>
                    <div id="grid-this-week" class="grid gap-4 items-stretch"
                        style="grid-template-columns:repeat(4,minmax(0,1fr))"></div>
                </section>

            </div>

            <!-- Ingen data (begge layout) -->
            <div id="no-data-msg" class="hidden text-center py-20">
                <h2 class="text-2xl font-bold text-slate-400 mb-2">Ingen plan denne veka</h2>
                <p class="text-slate-500">Kantineplanen er ikkje publisert enno.</p>
            </div>
        </main>

        <!-- Footer -->
        <footer class="bg-white border-t border-slate-200 py-3 px-6 text-center">
            <p class="text-slate-400 text-xs">Oppdaterer automatisk · <span id="sync-indicator"
                    class="text-emerald-500">● Tilkopla</span></p>
        </footer>
    </div>

    <script>
        const API_URL = 'api/index.php';
        const ALLERGENS = [
            { id: 'gluten', label: 'Gluten' },
            { id: 'skalldyr', label: 'Skaldyr' },
            { id: 'egg', label: 'Egg' },
            { id: 'fisk', label: 'Fisk' },
            { id: 'peanotter', label: 'Peanøtter' },
            { id: 'soya', label: 'Soya' },
            { id: 'mjolk', label: 'Mjølk' },
            { id: 'laktose', label: 'Laktose' },
            { id: 'notter', label: 'Nøtter' },
            { id: 'selleri', label: 'Selleri' },
            { id: 'sennep', label: 'Sennep' },
            { id: 'sesam', label: 'Sesamfrø' },
            { id: 'sulfitt', label: 'Svoveldioksid/sulfitt' },
            { id: 'lupin', label: 'Lupin' },
            { id: 'blautdyr', label: 'Blautdyr' }
        ];

        const screen = {

            state: {
                kalender: [],
                menus: {},
                bemanning: { driftsleiarar: {}, turnus: { A: {}, B: {}, C: {} } },
                firstLoad: true
            },

            /* ── Hjelparar ──────────────────────────────────────── */
            esc: str => String(str ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'),

            normalizeAllergens(value) {
                let ids = [];
                if (Array.isArray(value)) {
                    ids = value;
                } else if (typeof value === 'string' && value.trim()) {
                    try {
                        const parsed = JSON.parse(value);
                        ids = Array.isArray(parsed) ? parsed : [];
                    } catch {
                        ids = [];
                    }
                }
                const allowed = new Set(ALLERGENS.map(a => a.id));
                return [...new Set(ids.map(String).filter(id => allowed.has(id)))];
            },

            getAllergenLabels(dateId, key = 'allergens') {
                if (key === 'alternativ_allergens' && this.isAlternativeFree(dateId)) return [];
                const selected = new Set(this.normalizeAllergens(this.state.menus[dateId]?.[key] || []));
                return ALLERGENS.filter(a => selected.has(a.id)).map(a => a.label);
            },

            isAlternativeFree(dateId) {
                const value = this.state.menus[dateId]?.['alternativ_allergenfri'];
                return value === true || value === 1 || value === '1';
            },

            allergenList(labels, compact = false) {
                if (!labels.length) return '';
                const gridClass = compact
                    ? 'grid grid-cols-1 gap-y-0.5 pr-1'
                    : 'grid grid-cols-1 gap-y-1 pr-1';
                const itemClass = compact ? 'text-[11px]' : 'text-sm';
                return `<ul class="${gridClass} text-red-950 font-bold leading-snug">
                    ${labels.map(label => `<li class="flex items-start gap-2 ${itemClass}"><span aria-hidden="true" class="shrink-0">&bull;</span><span class="min-w-0">${this.esc(label)}</span></li>`).join('')}
                </ul>`;
            },

            allergenLine(dateId, compact = false, key = 'allergens') {
                const labels = this.getAllergenLabels(dateId, key);
                if (!labels.length) return '';
                if (compact) {
                    return `
                        <div class="mt-1 text-red-700">
                            <p class="text-[11px] font-extrabold leading-snug">Inneheld:</p>
                            ${this.allergenList(labels, true)}
                        </div>`;
                }
                return `
                    <div class="mt-3 rounded-xl bg-red-50 border border-red-200 px-3 py-2">
                        <p class="text-red-700 text-[11px] font-extrabold uppercase tracking-widest mb-1">Allergen og matomsyn</p>
                        <p class="text-red-950 text-sm font-extrabold leading-snug mb-1">Inneheld:</p>
                        ${this.allergenList(labels, false)}
                    </div>`;
            },

            alternativeBlock(dateId, compact = false) {
                const alternative = this.state.menus[dateId]?.['alternativ'] || '';
                if (!alternative) return '';
                const free = this.isAlternativeFree(dateId);
                if (compact) {
                    return `
                        <div class="mt-1.5 border-t border-amber-200 pt-1.5">
                            <p class="text-emerald-800 text-xs font-bold leading-snug">Alternativ: ${this.esc(alternative)}</p>
                            ${free
                                ? `<p class="mt-0.5 text-[11px] font-extrabold text-emerald-800 leading-snug">Allergenfritt alternativ</p>`
                                : this.allergenLine(dateId, true, 'alternativ_allergens')}
                        </div>`;
                }
                return `
                    <div class="mt-3 rounded-xl bg-emerald-50 border border-emerald-200 px-3 py-2">
                        <p class="text-emerald-700 text-[11px] font-extrabold uppercase tracking-widest mb-1">Alternativ</p>
                        <p class="text-emerald-950 text-base sm:text-lg font-bold leading-snug break-words">${this.esc(alternative)}</p>
                        ${free
                            ? `<p class="mt-2 inline-flex rounded-md bg-emerald-100 px-3 py-1 text-sm font-extrabold text-emerald-900">Allergenfritt alternativ</p>`
                            : this.allergenLine(dateId, false, 'alternativ_allergens')}
                    </div>`;
            },

            getWeekdayName(dateId) {
                const d = new Date(dateId + 'T12:00:00');
                return ['Sundag', 'Måndag', 'Tysdag', 'Onsdag', 'Torsdag', 'Fredag', 'Laurdag'][d.getDay()];
            },

            getDateStr(dateId) {
                const [, m, d] = dateId.split('-');
                return `${d}.${m}`;
            },

            getTodayId() {
                const t = new Date();
                return `${t.getFullYear()}-${String(t.getMonth() + 1).padStart(2, '0')}-${String(t.getDate()).padStart(2, '0')}`;
            },

            _toId(date) {
                return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}-${String(date.getDate()).padStart(2, '0')}`;
            },

            isWeekday(dateId) {
                const day = new Date(dateId + 'T12:00:00').getDay();
                return day >= 1 && day <= 5;
            },

            getDisplayStartId() {
                const todayId = this.getTodayId();
                const start = new Date(todayId + 'T12:00:00');
                const day = start.getDay();
                if (day === 6) start.setDate(start.getDate() + 2);
                if (day === 0) start.setDate(start.getDate() + 1);
                return this._toId(start);
            },

            getDisplayDays() {
                const startId = this.getDisplayStartId();
                let days = this.state.kalender
                    .filter(d => d.id >= startId && this.isWeekday(d.id))
                    .sort((a, b) => a.id.localeCompare(b.id))
                    .slice(0, 4);

                if (!days.length) {
                    const todayId = this.getTodayId();
                    days = this.state.kalender
                        .filter(d => d.id >= todayId && this.isWeekday(d.id))
                        .sort((a, b) => a.id.localeCompare(b.id))
                        .slice(0, 4);
                }
                return days;
            },

            /* ── API ─────────────────────────────────────────────── */
            async fetchData() {
                try {
                    const res = await fetch(API_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                        body: JSON.stringify({ role: 'infoskjerm', action: 'load' })
                    });
                    const json = await res.json();
                    if (json.error) return;
                    this.state.kalender = json.kalender || [];
                    this.state.menus = json.menus || {};
                    this.state.bemanning = json.bemanning || { driftsleiarar: {}, turnus: { A: {}, B: {}, C: {} } };
                    this.render();
                    document.getElementById('sync-indicator').textContent = '● Tilkopla';
                    document.getElementById('sync-indicator').className = 'text-emerald-500';
                } catch {
                    document.getElementById('sync-indicator').textContent = '● Frakopla';
                    document.getElementById('sync-indicator').className = 'text-amber-400';
                }
            },

            /* ── Bygg eit dagkort (desktop) ─────────────────────── */
            buildCard(day, todayId, animate, focusId = todayId) {
                const isToday = day.id === todayId;
                const isFocus = day.id === focusId;
                const isClosed = day.status === 'closed';
                const weekday = this.getWeekdayName(day.id);
                const dateStr = this.getDateStr(day.id);
                const meny = this.state.menus[day.id]?.['dagens'] || '';
                const alternative = this.state.menus[day.id]?.['alternativ'] || '';
                const allergenHtml = meny ? this.allergenLine(day.id) : '';
                const alternativeHtml = this.alternativeBlock(day.id);

                let cardBg, border, todayClass, sizeClass, padding, opacity;
                if (isFocus && !isClosed) {
                    cardBg = 'bg-indigo-600';
                    border = 'border-indigo-700';
                    todayClass = 'today-card';
                    sizeClass = 'z-10 shadow-2xl shadow-indigo-300/60 mt-0';
                    padding = 'pt-10 sm:pt-12 pb-6 px-5 sm:px-6';
                    opacity = '';
                } else if (isFocus && isClosed) {
                    cardBg = 'bg-slate-300';
                    border = 'border-slate-400';
                    todayClass = '';
                    sizeClass = 'shadow-md mt-0';
                    padding = 'pt-10 sm:pt-12 pb-6 px-5 sm:px-6';
                    opacity = '';
                } else if (isClosed) {
                    cardBg = 'bg-slate-200'; border = 'border-slate-300'; todayClass = ''; sizeClass = 'mt-6 sm:mt-8';
                    padding = 'p-5 sm:p-6'; opacity = 'opacity-50';
                } else {
                    cardBg = 'bg-white'; border = 'border-slate-400'; todayClass = ''; sizeClass = 'shadow-md mt-6 sm:mt-8';
                    padding = 'p-5 sm:p-6'; opacity = '';
                }

                const animClass = animate ? 'init-animate' : '';
                const dayTextCls = isFocus ? 'text-white' : isClosed ? 'text-slate-400' : 'text-slate-800';
                const dateTextCls = isFocus ? 'text-indigo-100' : isClosed ? 'text-slate-400' : 'text-slate-500';

                const statusBadge = isClosed
                    ? `<span class="inline-flex items-center bg-red-100 text-red-700 border border-red-200 text-xs font-bold px-3 py-1 rounded-full">Stengt</span>`
                    : (isFocus
                        ? `<span class="inline-flex items-center bg-white/20 text-white border border-white/30 text-xs font-bold px-3 py-1 rounded-full">Open</span>`
                        : `<span class="inline-flex items-center bg-emerald-50 text-emerald-700 border border-emerald-200 text-xs font-bold px-3 py-1 rounded-full">Open</span>`);

                const todayLabel = isFocus
                    ? `<span class="bg-white text-indigo-700 text-[10px] font-extrabold uppercase tracking-widest px-2.5 py-0.5 rounded-full shadow">${isToday ? 'I dag' : 'Neste dag'}</span>`
                    : '';

                // Menyfargar: gul = har meny, grå = ingen meny / stengt — same på alle korttypar
                let menyHtml;
                if (isClosed) {
                    menyHtml = `
                <div class="mt-auto pt-4 rounded-xl bg-slate-100 border border-slate-300 p-4">
                    <p class="text-slate-500 text-sm italic">${this.esc(day.merknad || 'Stengt')}</p>
                </div>`;
                } else if (meny || alternative) {
                    menyHtml = `
                <div class="mt-auto pt-4 rounded-xl bg-amber-100 border-2 border-amber-400 p-4">
                    <p class="text-amber-700 text-[11px] font-extrabold uppercase tracking-widest mb-2">Dagens meny</p>
                    ${meny
                        ? `<p class="text-amber-950 text-lg font-bold leading-snug break-words">${this.esc(meny)}</p>`
                        : `<p class="text-amber-700/70 text-sm italic">Ingen hovudmeny lagt inn</p>`}
                    ${allergenHtml}
                    ${alternativeHtml}
                </div>`;
                } else {
                    menyHtml = `
                <div class="mt-auto pt-4 rounded-xl bg-slate-100 border border-slate-200 p-4">
                    <p class="text-slate-400 text-[11px] font-bold uppercase tracking-widest mb-1.5">Dagens meny</p>
                    <p class="text-slate-400 text-sm italic">Ikkje lagt inn enno</p>
                </div>`;
                }

                return `
            <div class="${animClass} ${todayClass} ${cardBg} border-2 ${border} ${sizeClass} ${padding} ${opacity} rounded-2xl flex flex-col">
                <div class="flex items-start justify-between mb-3 gap-2">
                    <div>
                        <p class="text-2xl sm:text-3xl font-extrabold leading-tight ${dayTextCls}">${weekday}</p>
                        <p class="text-base font-semibold mt-0.5 ${dateTextCls}">${dateStr}</p>
                    </div>
                    <div class="flex flex-col items-end gap-1.5 shrink-0">
                        ${todayLabel}
                        ${statusBadge}
                    </div>
                </div>
                ${menyHtml}
            </div>`;
            },

            /* ── Mobil-render (i dag + vekeoversikt) ────────────── */
            renderMobile() {
                const container = document.getElementById('mobile-today');
                const displayDays = this.getDisplayDays();
                const todayId = this.getTodayId();

                if (!displayDays.length) {
                    container.innerHTML = `
                      <div class="text-center py-16">
                        <p class="text-slate-500">Kantineplanen er ikkje publisert enno.</p>
                      </div>`;
                    return;
                }

                const mainDay = displayDays[0];

                const isClosed = mainDay.status === 'closed';
                const isToday = mainDay.id === todayId;
                const meny = this.state.menus[mainDay.id]?.['dagens'] || '';
                const alternative = this.state.menus[mainDay.id]?.['alternativ'] || '';
                const allergenHtml = meny ? this.allergenLine(mainDay.id) : '';
                const alternativeHtml = this.alternativeBlock(mainDay.id);
                const weekday = this.getWeekdayName(mainDay.id);
                const dateStr = this.getDateStr(mainDay.id);

                /* ── Hovudkort ── */
                let menyBlock;
                if (isClosed) {
                    menyBlock = `
                      <div class="mt-6 rounded-2xl bg-white/10 border border-white/20 p-5 text-center">
                        <p class="text-indigo-100 text-lg italic">${this.esc(mainDay.merknad || 'Stengt')}</p>
                      </div>`;
                } else if (meny || alternative) {
                    menyBlock = `
                      <div class="mt-6 rounded-2xl bg-amber-100 border-2 border-amber-400 p-5">
                        <p class="text-amber-700 text-xs font-extrabold uppercase tracking-widest mb-2">Dagens meny</p>
                        ${meny
                            ? `<p class="text-amber-950 text-2xl font-bold leading-snug break-words">${this.esc(meny)}</p>`
                            : `<p class="text-amber-700/70 text-sm italic">Ingen hovudmeny lagt inn</p>`}
                        ${allergenHtml}
                        ${alternativeHtml}
                      </div>`;
                } else {
                    menyBlock = `
                      <div class="mt-6 rounded-2xl bg-white/10 border border-white/20 p-5">
                        <p class="text-indigo-200 text-xs font-extrabold uppercase tracking-widest mb-1">Dagens meny</p>
                        <p class="text-indigo-200 italic text-sm">Ikkje lagt inn enno</p>
                      </div>`;
                }

                const heroBg = isClosed ? 'bg-slate-600' : 'bg-indigo-600';

                const heroCard = `
                  <div class="${heroBg} today-card rounded-3xl p-7 shadow-2xl shadow-indigo-300/40 text-white">
                    <div class="flex items-start justify-between mb-1">
                      <div>
                        <p class="text-4xl font-extrabold leading-tight">${weekday}</p>
                        <p class="text-indigo-200 text-lg font-semibold mt-1">${dateStr}</p>
                      </div>
                      <div class="flex flex-col items-end gap-2">
                        ${isToday ? `<span class="bg-white text-indigo-700 text-xs font-extrabold uppercase tracking-widest px-3 py-1 rounded-full">I dag</span>` : `<span class="bg-white/20 text-white text-xs font-bold px-3 py-1 rounded-full border border-white/30">Neste dag</span>`}
                        ${isClosed
                        ? `<span class="bg-red-400/30 text-white border border-red-300/40 text-xs font-bold px-3 py-1 rounded-full">Stengt</span>`
                        : `<span class="bg-white/20 text-white border border-white/30 text-xs font-bold px-3 py-1 rounded-full">Open</span>`}
                      </div>
                    </div>
                    ${menyBlock}
                  </div>`;

                /* ── Resterande dagar (kompakt liste) ── */
                const restDays = displayDays.slice(1);
                let restHtml = '';
                if (restDays.length) {
                    const rows = restDays.map(d => {
                        const wday = this.getWeekdayName(d.id);
                        const dstr = this.getDateStr(d.id);
                        const m = this.state.menus[d.id]?.['dagens'] || '';
                        const alt = this.state.menus[d.id]?.['alternativ'] || '';
                        const allergen = m ? this.allergenLine(d.id, true) : '';
                        const alternativeCompact = this.alternativeBlock(d.id, true);
                        const cls = d.id === todayId
                            ? 'bg-indigo-50 border-indigo-200'
                            : d.status === 'closed'
                                ? 'bg-slate-50 border-slate-200 opacity-60'
                                : 'bg-white border-slate-200';
                        return `
                          <div class="flex items-center justify-between ${cls} border rounded-xl px-4 py-3 gap-3">
                            <div class="min-w-0">
                              <span class="font-bold text-slate-800 text-sm">${wday}</span>
                              <span class="text-slate-400 text-sm ml-2">${dstr}</span>
                              ${m ? `<p class="text-amber-700 text-xs truncate mt-0.5">${this.esc(m)}</p>` : ''}
                              ${allergen}
                              ${alt ? alternativeCompact : ''}
                            </div>
                            ${d.status === 'closed'
                                ? `<span class="text-xs text-red-500 font-bold shrink-0">Stengt</span>`
                                : `<span class="text-xs text-emerald-600 font-bold shrink-0">Open</span>`}
                          </div>`;
                    }).join('');
                    restHtml = `
                      <div>
                        <h3 class="text-xs font-bold text-slate-400 uppercase tracking-widest mb-3">Komande dagar</h3>
                        <div class="space-y-2">${rows}</div>
                      </div>`;
                }

                container.innerHTML = heroCard + restHtml;
            },

            /* ── Desktop-render ─────────────────────────────────── */
            render() {
                const noData = document.getElementById('no-data-msg');
                const secThis = document.getElementById('section-this-week');
                const gridThis = document.getElementById('grid-this-week');

                const displayDays = this.getDisplayDays();
                const todayId = this.getTodayId();
                const focusId = displayDays[0]?.id || todayId;
                const animate = this.state.firstLoad;
                this.state.firstLoad = false;

                // Mobil render alltid
                this.renderMobile();

                if (!displayDays.length) {
                    secThis.classList.add('hidden');
                    noData.classList.remove('hidden');
                    gridThis.innerHTML = '';
                    return;
                }

                noData.classList.add('hidden');

                secThis.classList.remove('hidden');
                gridThis.style.gridTemplateColumns = `repeat(${displayDays.length}, minmax(0, 1fr))`;
                gridThis.innerHTML = displayDays.map(day => this.buildCard(day, todayId, animate, focusId)).join('');
            },

            /* ── Analog klokke ──────────────────────────────────── */
            startClock() {
                // Teikn 60 merker éin gong
                const ticks = document.getElementById('clock-ticks');
                for (let i = 0; i < 60; i++) {
                    const isMajor = i % 5 === 0;
                    const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                    line.setAttribute('x1', '50');
                    line.setAttribute('y1', isMajor ? '4' : '7');
                    line.setAttribute('x2', '50');
                    line.setAttribute('y2', isMajor ? '13' : '11');
                    line.setAttribute('stroke', isMajor ? '#94a3b8' : '#cbd5e1');
                    line.setAttribute('stroke-width', isMajor ? '2.5' : '1.2');
                    line.setAttribute('stroke-linecap', 'round');
                    line.setAttribute('transform', `rotate(${i * 6}, 50, 50)`);
                    ticks.appendChild(line);
                }

                const tick = () => {
                    const now = new Date();
                    const h = now.getHours() % 12;
                    const m = now.getMinutes();
                    const s = now.getSeconds();
                    const ms = now.getMilliseconds();

                    const hourDeg = h * 30 + m * 0.5 + s * (0.5 / 60);
                    const minuteDeg = m * 6 + s * 0.1;
                    const secondDeg = s * 6 + ms * 0.006;

                    document.getElementById('clock-hour').setAttribute('transform', `rotate(${hourDeg},   50, 50)`);
                    document.getElementById('clock-minute').setAttribute('transform', `rotate(${minuteDeg}, 50, 50)`);
                    document.getElementById('clock-second').setAttribute('transform', `rotate(${secondDeg}, 50, 50)`);

                    document.getElementById('clock-digital').textContent =
                        now.toLocaleTimeString('no', { hour: '2-digit', minute: '2-digit' });
                };
                tick();
                setInterval(tick, 1000);
            },

            /* ── Init ────────────────────────────────────────────── */
            async init() {
                this.startClock();
                await this.fetchData();
                document.getElementById('loading-screen').classList.add('hidden');
                document.getElementById('main-view').classList.remove('hidden');
                this.scheduleNextPoll();
            },

            scheduleNextPoll() {
                const now = new Date();
                const totalMins = now.getHours() * 60 + now.getMinutes();
                const isActiveTime = (totalMins >= 655 && totalMins <= 705);
                const delay = isActiveTime ? 10000 : 300000;
                setTimeout(() => {
                    this.fetchData().finally(() => this.scheduleNextPoll());
                }, delay);
            }
        };

        document.addEventListener('DOMContentLoaded', () => screen.init());
    </script>
</body>
